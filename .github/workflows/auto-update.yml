name: 'Update and build kernels'
on:
  workflow_dispatch:
    inputs:
      update-flake-inputs:
        description: 'Update flake inputs (nixpkgs, flake-parts, ...) even without a new kernel'
        type: boolean
        default: false
  schedule:
    # Check for new CachyOS releases daily. A nixpkgs update rebuilds every kernel when it
    # changes their toolchain (6 of 33 daily updates in Sep-Oct 2026), so flake inputs are
    # updated along with new linux-cachyos sources (a release, re-release or config change),
    # whose kernels rebuild anyway, or once the locked nixpkgs is a week old. See the commit job.
    - cron: '37 17 * * *'

# Each job requests the permissions it needs
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CACHIX_CACHE: nixos-cachyos-kernels

jobs:
  update:
    # update.py runs CachyOS PKGBUILDs, so this job gets no write access and no secrets.
    # Its only output is an artifact, validated by the commit job.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          # Read-only token, avoids GitHub API rate limits
          github_access_token: ${{ github.token }}

      - name: Update CachyOS versions
        run: nix run .#update-cachyos

      - name: Upload update
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update
          path: |
            kernel-cachyos/version.json
            zfs-cachyos/version.json
          if-no-files-found: error
          retention-days: 7

  commit:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      rev: ${{ steps.commit.outputs.rev }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download update
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update
          path: ${{ runner.temp }}/update

      - name: Validate update
        run: python3 -I validate_update.py "$RUNNER_TEMP/update" | tee "$RUNNER_TEMP/changes.txt"

      # Update flake inputs here rather than in the update job: a flake.lock coming from the
      # job that runs PKGBUILDs could pin any commit GitHub serves as NixOS/nixpkgs, forks included.
      - name: Decide whether to update flake inputs
        id: inputs
        env:
          FORCE_UPDATE: ${{ inputs.update-flake-inputs }}
        run: |
          # The linux-cachyos kernels rebuild when their source changes (a new version or a
          # re-release of the same one) or their config does, so update flake inputs with them.
          sources() { python3 -I -c 'import json, sys; v = json.load(sys.stdin)["linux-cachyos"]; print(v["url"].rsplit("/", 1)[1], v["hash"], v["configHash"])'; }
          old=$(git show HEAD:kernel-cachyos/version.json | sources)
          new=$(sources < kernel-cachyos/version.json)
          locked=$(python3 -I -c 'import json; print(json.load(open("flake.lock"))["nodes"]["nixpkgs"]["locked"]["lastModified"])')
          age=$(( ($(date +%s) - locked) / 86400 ))
          echo "linux-cachyos source and config: $old -> $new"
          echo "locked nixpkgs is $age days old"
          if [ "$FORCE_UPDATE" = true ] || [ "$old" != "$new" ] || [ "$age" -ge 7 ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install nix
        if: steps.inputs.outputs.update == 'true'
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}

      - name: Update flake inputs
        if: steps.inputs.outputs.update == 'true'
        run: |
          nix flake update
          git show HEAD:flake.lock > "$RUNNER_TEMP/flake.lock.old"
          python3 -I - "$RUNNER_TEMP/flake.lock.old" flake.lock <<'EOF' | tee -a "$RUNNER_TEMP/changes.txt"
          import json, sys
          old, new = (json.load(open(path))["nodes"] for path in sys.argv[1:])
          for name, node in sorted(new.items()):
              rev, previous = node.get("locked", {}).get("rev"), old.get(name, {}).get("locked", {}).get("rev")
              if rev != previous:
                  print(f"{name}: {(previous or '')[:12]} -> {(rev or '')[:12]}")
          EOF

      - name: Commit and push
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flake.lock kernel-cachyos/version.json zfs-cachyos/version.json
          if git diff --cached --quiet; then
            echo "No changes" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            { echo 'Auto update flake'; echo; cat "$RUNNER_TEMP/changes.txt"; } | git commit -F -
            git push origin "HEAD:$GITHUB_REF_NAME"
            { echo '```'; cat "$RUNNER_TEMP/changes.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "rev=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.kernel }})
    needs: commit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each kernel takes roughly 350-400 MB of the Cachix cache (out, modules and dev
        # outputs), and older builds are evicted once the 5 GB free tier is full. Keep a
        # full round around 2.5 GB (7 kernels) so the previous one stays mostly available
        # while this one builds.
        #
        # With the kernel's SIMD-disabled flags, x86_64-v4 compiles the same code as v3 and
        # x86_64-v2 adds almost nothing over generic, so only generic, v3 and zen4 are cached.
        # Keep in sync with the checks in flake.nix.
        kernel:
          - linux-cachyos-latest
          - linux-cachyos-latest-lto
          - linux-cachyos-lts
          - linux-cachyos-bore
          - linux-cachyos-latest-lto-x86_64-v3
          - linux-cachyos-latest-lto-zen4
          # GCC: with Clang, the GCC plugins of its config are unavailable (no latent entropy)
          - linux-cachyos-hardened
    env:
      KERNEL: ${{ matrix.kernel }}
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          # Linking LTO kernels and their modules can need more than the runner's 16 GB RAM
          swap-size-mb: 16384
          build-mount-path: '/nix'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit.outputs.rev }}
          persist-credentials: false

      - name: Install nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            build-dir = /nix/var/nix/builds
            log-lines = 50

      # Out of memory, the whole runner stalls and GitHub drops the job ("The hosted runner
      # lost communication with the server"). Throttle and swap the Nix builds instead.
      - name: Cap Nix build memory
        run: sudo systemctl set-property nix-daemon.service MemoryHigh=12G

      - name: Use Cachix cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          # Pull only, the auth token is only given to the push steps below
          skipPush: true

      - name: Build kernel
        run: nix build --no-link --print-out-paths ".#$KERNEL^*" | tee "$RUNNER_TEMP/kernel-paths"

      # Only push what users download: the kernel outputs and their runtime closure.
      # Sources, configs and anything already on cache.nixos.org are skipped.
      # zstd level 16 (cachix's maximum) makes the dev output ~23% smaller than the
      # default level 2, for a few extra minutes of compression.
      - name: Push kernel
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: cachix push --compression-level 16 "$CACHIX_CACHE" < "$RUNNER_TEMP/kernel-paths"

      # ZFS failures (usually an unsupported kernel version) don't block the release
      - name: Build ZFS module
        id: zfs
        continue-on-error: true
        run: |
          nix build --no-link --print-out-paths \
            ".#legacyPackages.x86_64-linux.linuxPackages-${KERNEL#linux-}.zfs_cachyos" | tee "$RUNNER_TEMP/zfs-paths"

      - name: Push ZFS module
        if: steps.zfs.outcome == 'success'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: cachix push --compression-level 16 "$CACHIX_CACHE" < "$RUNNER_TEMP/zfs-paths"

      # Only checks that the kernel modules NixOS loads (open and proprietary) still build, so a
      # kernel that breaks NVIDIA gets noticed. Not pushed: they are unfree, and users build
      # them in minutes. Like ZFS, failures don't block the release.
      - name: Check NVIDIA modules
        id: nvidia
        continue-on-error: true
        run: |
          nvidia=".#legacyPackages.x86_64-linux.linuxPackages-${KERNEL#linux-}.nvidiaPackages"
          nix build --no-link --keep-going \
            "$nvidia.latest.open" "$nvidia.latest.mod" "$nvidia.stable.open" "$nvidia.stable.mod"

      # Modules that copy their .ko instead of using modules_install (like acpi_call did) break
      # the NixOS build unless helpers.kernelModuleSignOverride signs them. Checks it still does,
      # with a test module (tests/module-signing). Like ZFS, failures don't block the release.
      - name: Check module signing
        id: signing
        continue-on-error: true
        run: nix build --no-link --print-build-logs ".#checks.x86_64-linux.module-signing-$KERNEL"

      - name: Summary
        if: always()
        env:
          ZFS_OUTCOME: ${{ steps.zfs.outcome }}
          NVIDIA_OUTCOME: ${{ steps.nvidia.outcome }}
          SIGNING_OUTCOME: ${{ steps.signing.outcome }}
        run: |
          {
            echo "### $KERNEL"
            echo "ZFS module: $ZFS_OUTCOME"
            echo "NVIDIA modules (latest and stable, open and proprietary): $NVIDIA_OUTCOME"
            echo "Signing of modules installed without modules_install: $SIGNING_OUTCOME"
            echo '```'
            cat "$RUNNER_TEMP/kernel-paths" "$RUNNER_TEMP/zfs-paths" 2>/dev/null | xargs -r nix path-info --size --human-readable
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    # Publish the commit whose kernels are all in the cache on the release branch.
    # GITHUB_TOKEN can't push a ref that adds or changes workflow files, so release holds
    # snapshots of that commit without .github/, which builds the exact same kernels.
    needs: [commit, build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit.outputs.rev }}

      - name: Publish release snapshot
        env:
          REV: ${{ needs.commit.outputs.rev }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git ls-tree "$REV" | awk -F '\t' '$2 != ".github"' | git mktree)
          parent=()
          if git fetch --depth=1 origin release; then
            if [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$tree" ]; then
              echo "release already matches $REV"
              exit 0
            fi
            parent=(-p FETCH_HEAD)
          fi
          snapshot=$(git commit-tree "$tree" "${parent[@]}" -m "Release $REV" -m "Snapshot of master at $REV, without .github/.")
          git push origin "$snapshot:refs/heads/release"
